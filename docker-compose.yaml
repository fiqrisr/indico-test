services:
  postgres:
    image: postgres:15-alpine
    container_name: indico-test-postgres
    restart: unless-stopped
    env_file:
      - path: ./core/.env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-indico_test_db}
    security_opt:
      - apparmor:unconfined
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-indico_test_db}",
        ]
      interval: 3s
      timeout: 3s
      retries: 10

  core:
    build:
      context: ./core
      dockerfile: Dockerfile
    container_name: indico-test-core
    restart: unless-stopped
    ports:
      - "${PORT:-8081}:8080"
    env_file:
      - path: ./core/.env
        required: false
    environment:
      PORT: "8080"
      GIN_MODE: ${GIN_MODE:-release}
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-indico_test_db}?sslmode=disable"
      EXPIRY_INTERVAL: ${EXPIRY_INTERVAL:-30s}
      RESERVATION_EXPIRY_MINUTES: ${RESERVATION_EXPIRY_MINUTES:-5}
    security_opt:
      - apparmor:unconfined
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: indico-test-web
    restart: unless-stopped
    init: true
    ports:
      - "${WEB_PORT:-3000}:3000"
    env_file:
      - path: ./web/.env
        required: false
    environment:
      VITE_API_TARGET: ${VITE_API_TARGET:-http://core:8080}
    security_opt:
      - apparmor:unconfined
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - core

volumes:
  postgres_data:
